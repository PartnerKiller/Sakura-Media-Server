server.port=5000
server.http2.enabled=true

# Datasource configuration with H2 Database
spring.datasource.url=jdbc:h2:file:./mediadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sakura
spring.datasource.password=sakura

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# File upload properties (no limits, chunking is handled programmatically)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
